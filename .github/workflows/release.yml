name: Release

# Push a tag like `v0.7.0` to publish the language server to npm. The extension
# installs this npm package at runtime via the Zed Rust Extension API.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          EXT_VER=$(grep -m1 '^version' extension.toml | sed -E 's/.*"(.*)".*/\1/')
          PKG_VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG cargo=$CARGO_VER extension=$EXT_VER package=$PKG_VER"
          if [ "$TAG" != "$CARGO_VER" ] || [ "$TAG" != "$EXT_VER" ] || [ "$TAG" != "$PKG_VER" ]; then
            echo "::error::Tag v$TAG must match Cargo.toml ($CARGO_VER), extension.toml ($EXT_VER) and package.json ($PKG_VER)"
            exit 1
          fi

      - name: Run tests
        run: npm test

      - name: Publish to npm
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VER=$(node -p "require('./package.json').version")

          if npm view "$PKG_NAME@$PKG_VER" version >/dev/null 2>&1; then
            echo "$PKG_NAME@$PKG_VER already exists on npm, skipping publish."
            exit 0
          fi

          npm publish --access public --provenance
