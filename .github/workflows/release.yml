name: Release

# Push a tag like `v0.4.0` to build the language server bundle and publish it
# as a GitHub release asset named `i18n-lens-server.cjs`. The extension
# downloads this asset at runtime from the matching release tag.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches manifest versions
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CARGO_VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          EXT_VER=$(grep -m1 '^version' extension.toml | sed -E 's/.*"(.*)".*/\1/')
          PKG_VER=$(node -p "require('./package.json').version")
          echo "tag=$TAG cargo=$CARGO_VER extension=$EXT_VER package=$PKG_VER"
          if [ "$TAG" != "$CARGO_VER" ] || [ "$TAG" != "$EXT_VER" ] || [ "$TAG" != "$PKG_VER" ]; then
            echo "::error::Tag v$TAG must match Cargo.toml ($CARGO_VER), extension.toml ($EXT_VER) and package.json ($PKG_VER)"
            exit 1
          fi

      - name: Build language server bundle
        run: npm run build:server

      - name: Create release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: server/dist/i18n-lens-server.cjs
          fail_on_unmatched_files: true
          generate_release_notes: true
